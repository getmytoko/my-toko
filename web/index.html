<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyToko</title>
  <meta name="description" content="Katalog online UMKM — pesan langsung via WhatsApp" />
  <meta name="theme-color" content="#23103a" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%8D%EF%B8%8F%3C/text%3E%3C/svg%3E"
  />

  <!-- Tailwind CSS (utilitas runtime) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter (body) + Fraunces (display/judul) — dipakai oleh style.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
    rel="stylesheet"
  />

  <!-- Aset Terpusat dari Repo Master via jsDelivr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/getmytoko/my-toko@main/web/style.css" />
</head>

<body>
  <!--
    SHELL TUNGGAL — seluruh UI (navbar, hero, katalog, modal, keranjang,
    form checkout WhatsApp, dll.) digambar otomatis oleh app.js (CDN master)
    berdasarkan data lokal ./data/products.json dan ./data/store_info.json.
    Markup ini TIDAK diubah — hanya style.css & font yang direvisi.
  -->
  <div id="app" class="min-h-screen flex flex-col bg-app text-body">
    <div class="app-boot" id="app-boot">
      <div class="spinner" aria-hidden="true"></div>
      <p>Memuat katalog…</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/getmytoko/my-toko@main/web/app.js"></script>
</body>
</html>
